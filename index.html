<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Extract query parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const secret = urlParams.get('secret');
        
        // If we have userId and secret, redirect to app with them
        if (userId && secret) {
            window.location.href = `myordr://oauth-success?userId=${encodeURIComponent(userId)}&secret=${encodeURIComponent(secret)}`;
        } else {
            // Otherwise just redirect to app (session might already be created)
            window.location.href = 'myordr://oauth-success';
        }
    </script>
</head>
<body>
    <p>Redirecting to app...</p>
</body>
</html>
