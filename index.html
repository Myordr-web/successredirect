<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Successful - MyOrdr</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 2rem;
        }
        p {
            margin: 0 0 2rem 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>Sign In Successful!</h1>
        <p>You have been successfully signed in to MyOrdr.</p>
        <div class="loading"></div>
        <p>Redirecting you back to the app...</p>
    </div>

    <script>
        // Extract userId and secret from URL query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const secret = urlParams.get('secret');
        
        console.log('OAuth callback received - userId:', userId ? 'present' : 'missing', 'secret:', secret ? 'present' : 'missing');
        console.log('Full URL:', window.location.href);
        console.log('Query string:', window.location.search);
        
        // Also check hash/fragment (some OAuth flows use #)
        let hashUserId = null;
        let hashSecret = null;
        if (window.location.hash) {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            hashUserId = hashParams.get('userId');
            hashSecret = hashParams.get('secret');
            console.log('Hash params - userId:', hashUserId ? 'present' : 'missing', 'secret:', hashSecret ? 'present' : 'missing');
        }
        
        // Use hash params if query params are missing
        const finalUserId = userId || hashUserId;
        const finalSecret = secret || hashSecret;
        
        // Build the app redirect URL with parameters
        let appUrl = 'myordr://oauth-success';
        if (finalUserId && finalSecret) {
            appUrl += `?userId=${encodeURIComponent(finalUserId)}&secret=${encodeURIComponent(finalSecret)}`;
            console.log('Redirecting to app with userId and secret');
        } else {
            console.warn('Warning: userId or secret missing from URL');
            console.warn('This might mean Appwrite created the session server-side');
            console.warn('The app will try to check for an existing session');
            // Still redirect - the app will check for an existing session
            appUrl += '?session_check=true';
        }
        
        // Try to redirect immediately
        try {
            window.location.href = appUrl;
        } catch (e) {
            console.error('Error redirecting:', e);
        }
        
        // Fallback - try again after a short delay
        setTimeout(() => {
            try {
                window.location.href = appUrl;
            } catch (e) {
                console.error('Error in fallback redirect:', e);
            }
        }, 500);
        
        // Additional fallback - try to close the window after 2 seconds
        setTimeout(() => {
            try {
                window.close();
            } catch (e) {
                // Can't close window in some contexts
            }
        }, 2000);
        
        // Last resort - try to open the app URL one more time
        setTimeout(() => {
            try {
                window.location.href = appUrl;
            } catch (e) {
                console.error('Error in final redirect attempt:', e);
            }
        }, 1500);
    </script>
</body>
</html>
